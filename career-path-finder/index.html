<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Path Finder</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Braah+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Splash Screen -->
        <div class="screen" id="splash-screen">
            <div class="splash-content">
                <h1 class="logo-text">pathfinder//</h1>
                <button class="primary-button" onclick="showScreen('getting-started')">
                    Get Started
                    <span class="arrow-right">→</span>
                </button>
            </div>
        </div>

        <!-- Getting Started Screen -->
        <div class="screen hidden" id="getting-started-screen">
            <div class="getting-started-content">
                <h1>Start Your Career Journey</h1>
            
                <div class="features-list">
                    <div class="feature-item">
                        <span class="feature-icon">📚</span>
                        <span>Educational Background</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">💡</span>
                        <span>Skills & Expertise</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">💼</span>
                        <span>Work Experience</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🎯</span>
                        <span>Career Interests</span>
                    </div>
                </div>
                <button class="primary-button" onclick="showScreen('login')">
                    Next
                    <span class="arrow-right">→</span>
                </button>
            </div>
        </div>

        <!-- Login Screen -->
        <div class="screen hidden" id="login-screen">
            <div class="login-content">
                <form id="login-form" class="dark-form" onsubmit="handleLogin(event)">
                    <h2>Welcome Back</h2>
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="your.email@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    <button type="submit" class="primary-button">Log in</button>
                    <p class="form-footer">
                        Don't have an account? <a href="#" onclick="showScreen('signup')">Create one</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- Signup Screen -->
        <div class="screen hidden" id="signup-screen">
            <div class="signup-content">
                <form id="signup-form" class="dark-form" onsubmit="handleSignup(event)">
                    <h2>Create Your Account</h2>
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="your.email@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-fullname">Full Name</label>
                        <input type="text" id="signup-fullname" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-username">User Name</label>
                        <input type="text" id="signup-username" placeholder="Your username" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" 
                               placeholder="••••••••" 
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                               title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 characters"
                               required>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm-password">Confirm Password</label>
                        <input type="password" id="signup-confirm-password" placeholder="••••••••" required>
                    </div>
                    <div class="terms-checkbox">
                        <label>
                            <input type="checkbox" id="terms-agree" required>
                            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
                        </label>
                    </div>
                    <button type="submit" class="primary-button">Create Account</button>
                    <p class="form-footer">
                        Already have an account? <a href="#" onclick="showScreen('login')">Log in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification Component -->
    <div id="notification" class="notification hidden"></div>

    <script>
        // Utility to show notifications
        function showNotification(message, type = 'error') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            
            setTimeout(() => {
                notification.className = 'notification hidden';
            }, 3000);
        }

        // Screen management
        function showScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => {
                screen.classList.add('hidden');
            });
            
            document.getElementById(`${screenId}-screen`).classList.remove('hidden');
        }

        // Form handling
// Login handler
async function handleLogin(event) {
  event.preventDefault();
  
  try {
    const response = await fetch('http://localhost:5050/api/users/login', {
      method: 'POST',
      credentials: 'include', // Required for cookies
      headers: { 'Content-Type': 'application/json' ,
      
      },
      body: JSON.stringify({
        "email": document.getElementById('login-email').value,
        "password": document.getElementById('login-password').value
      })
    });

    if (!response.ok) throw new Error('Login failed');
    
    window.location.href = 'dashboard.html';
    console.log('Login successful');
  } catch (error) {
    showNotification(error.message, 'error');
  }
}

// Logout handler


async function handleSignup(event) {
    event.preventDefault();
    
    const email = document.getElementById('signup-email').value;
    const fullName = document.getElementById('signup-fullname').value;
    const password = document.getElementById('signup-password').value;
    const confirmPassword = document.getElementById('signup-confirm-password').value;
    const username = document.getElementById('signup-username').value;
    // Client-side validation
    if (password !== confirmPassword) {
        showNotification('Passwords do not match', 'error');
        return;
    }

    const button = event.target.querySelector('button');
    const originalText = button.textContent;
    
    try {
        button.textContent = 'Creating account...';
        button.disabled = true;

        const response = await fetch('http://localhost:5050/api/users/register', {
            method: 'POST',
            credentials: 'include', // For cookie-based authentication
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email,
                username, // Replace with dynamic username if needed
                firstName: fullName.split(' ')[0],
                lastName: fullName.split(' ').slice(1).join(' ') || '',
                password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Registration failed');
        }

        // Handle successful registration
        showNotification('Account created successfully!', 'success');
        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 1500);

    } catch (error) {
        console.error('Signup error:', error);
        showNotification(error.message, 'error');
    } finally {
        button.textContent = originalText;
        button.disabled = false;
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    try {
        const response = await fetch("http://localhost:5050/api/users/checkfortoken", {
            method: "GET",
            credentials: "include" // Ensures cookies are sent with the request
        });

        const data = await response.json();

        if (response.ok) {
            // Token found, redirect to dashboard
            window.location.href = "dashboard.html";
        } else {
            console.warn(data.message); // Token not found, stay on the current page
        }
    } catch (error) {
        console.error("Error checking token:", error);
    }
});
